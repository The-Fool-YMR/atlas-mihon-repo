pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // extensions-lib stubs are published through JitPack.
        maven { url = uri("https://www.jitpack.io") }
    }
}

rootProject.name = "atlas-mihon-extension"
include(":app")
