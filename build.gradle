// Root build file: plugin versions only (kept in step with Gradle 9.8.2 + JDK 17).
// AGP version mirrors keiyoushi/extensions-source. There is NO Kotlin
// plugin line here on purpose: AGP 9 bundles Kotlin support and
// refuses the org.jetbrains.kotlin.android plugin entirely.
// BUT AGP 9.4.1's bundled Kotlin is only 2.2.x, while the extensions-lib
// stubs and stdlib are Kotlin 2.4 — so per AGP's own docs, raise the
// built-in Kotlin via a buildscript classpath (this is the documented
// "upgrade to a higher KGP version" mechanism, not a plugin application).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10")
    }
}

plugins {
    id("com.android.application") version "9.4.1" apply false
}
