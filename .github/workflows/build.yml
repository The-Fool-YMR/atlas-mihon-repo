# Builds the ATLAS Mihon extension APK in the cloud — no Android
# Studio or local SDK needed. Runs on every push, or manually from
# the repo's Actions tab ("Run workflow").
#
# Output: the Actions run's artifact
# "tachiyomi-en.atlascomics-v1.6.1" contains the installable APK
# tachiyomi-en.atlascomics-v1.6.1.apk (version 1.6.1, code 1).
#
# Signing: release builds sign with the PRIVATE ATLAS release key
# (alias "atlas", PKCS#12). The keystore is a GitHub Secret
# (RELEASE_KEYSTORE_B64) and its password is another secret
# (RELEASE_KEYSTORE_PASSWORD) — neither is ever in the repo. The
# earlier committed debug.keystore (public Android debug key) is
# no longer used: Play Protect flags it, and it must never be
# published again. Every release build signs with the SAME release
# key, so store updates keep working; do not switch keys after
# anyone installs, or updates fail with a signature mismatch.
#
# SDK: GitHub's ubuntu runners already ship an Android SDK
# ($ANDROID_HOME with cmdline-tools). The earlier
# android-actions/setup-android step failed on the runner, so this
# workflow uses the preinstalled SDK directly and only downloads
# cmdline-tools as a fallback if it is missing.

name: Build ATLAS extension

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "No preinstalled cmdline-tools, downloading..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.8.2"

      - name: Restore release keystore
        # The release keystore is a GitHub Secret, never a repo file:
        # decode it into the app module dir. The signing config's
        # file("release.keystore") resolves relative to app/, NOT
        # the repo root — decoding to the root was run #25's
        # failure (validateSigningRelease: keystore not found).
        # GitHub masks secret values in logs automatically.
        run: echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > app/release.keystore

      - name: Fetch app icon
        # The launcher icon is binary, so it is not stored on this
        # branch: reuse the golden Lambda already published on the
        # store branch (branch "repo") of this same repository.
        run: |
          curl -fL -o /tmp/atlas-icon.png "https://raw.githubusercontent.com/The-Fool-YMR/atlas-mihon-repo/repo/icon/eu.kanade.tachiyomi.extension.en.atlascomics.png"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$d"
            cp /tmp/atlas-icon.png "app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_FILE: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tachiyomi-en.atlascomics-v1.6.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: tachiyomi-en.atlascomics-v1.6.1
          path: tachiyomi-en.atlascomics-v1.6.1.apk
