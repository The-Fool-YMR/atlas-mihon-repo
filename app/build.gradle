// AGP 9 bundles Kotlin support: the org.jetbrains.kotlin.android
// plugin must NOT be applied (AGP 9 refuses it). Kotlin is applied
// internally by AGP; the kotlin{} block below still configures it.
plugins {
    id("com.android.application")
}

android {
    namespace = "eu.kanade.tachiyomi.extension.en.atlascomics"
    compileSdk = 36

    defaultConfig {
        applicationId = "eu.kanade.tachiyomi.extension.en.atlascomics"
        minSdk = 23
        targetSdk = 34
        // Must match the store index: version 1.6.1, code 1.
        // Mihon derives libVersion 1.6 from the version name, and
        // 1.6 is in its supported list (1.4, 1.6). The source is
        // written against the tachiyomix 1.6 suspend API.
        versionCode = 1
        versionName = "1.6.1"
    }

    signingConfigs {
        debug {
            // Committed debug keystore: every CI build signs with the
            // same key, so store updates keep working. This is the
            // standard public Android debug key (password "android"),
            // not a private release key.
            storeFile = file("../debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Kotlin 2.x: the android.kotlinOptions block is superseded by the
// compilerOptions block. JVM 11 is the lowest target Kotlin 2.4
// accepts (1.8 was removed); D8 handles it on every Android version.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}

dependencies {
    // Source-api stubs for compilation only. At runtime Mihon itself
    // provides the real classes, and this APK must NOT bundle the
    // stubs: Mihon loads extension classes delegate-last, so bundled
    // stubs would shadow the app's real implementations.
    // Pin matches keiyoushi/extensions-source's catalog.
    compileOnly("com.github.keiyoushi:extensions-lib:42255ee5fa")
    // Same reasoning for OkHttp: provided by Mihon at runtime.
    compileOnly("com.squareup.okhttp3:okhttp:4.12.0")
    // org.json ships with Android; Kotlin stdlib comes from the plugin.
}
